// ===================== TRANSFERS FROM PRODUCTION =====================
// Production (Internal App) owns all stock. The cafe requests, production sends (HQ stock is deducted there),
// and the cafe confirms receipt here, which adds to cafe stock. Units are the same as production's.
const HQ_TO_CAFE_CAT={raw_material:'ingredient',flavoring:'ingredient',colouring:'ingredient',frozen_chilled:'ingredient',cookies_sprinkle:'topping',fruits_fillings:'topping',filling_ready:'topping',packaging:'packaging',cleaning:'shop'};
const HQ_CAT_LABELS={raw_material:'Raw material',flavoring:'Flavouring',colouring:'Colouring',cookies_sprinkle:'Cookies & sprinkles',frozen_chilled:'Frozen / chilled',fruits_fillings:'Fruits / fillings',filling_ready:'Crafted filling',packaging:'Packaging',cleaning:'Cleaning'};
let _transfers=null,_hqItems=[],_reqForm={},_reqSearch='',_reqCat='cafe';
function trItems(t,key){return (t.items||[]).filter(i=>+i[key]>0).map(i=>`${fq(i[key])} ${esc(i.unit||'')} ${esc(i.name)}`).join(', ')||'—';}
function fmtDT(t){return t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';}
async function loadTransfersBadge(){const {data,error}=await sb.from('mm_cafe_transfers').select('id,status').eq('status','sent');if(!error){_transfers=_transfers||[];const ids=new Set((data||[]).map(x=>x.id));_transfers=[..._transfers.filter(x=>!ids.has(x.id)),...(data||[])];updInvBadge();}}
function transfersHtml(){
  if(_transfers===null)return `<div class="card note" style="color:var(--red)">⚠️ Transfer table missing — run the transfer SQL first.</div>`;
  const sent=_transfers.filter(t=>t.status==='sent'),req=_transfers.filter(t=>t.status==='requested');
  const recent=_transfers.filter(t=>t.status==='received'||t.status==='cancelled').slice(0,5);
  let h='';
  if(sent.length)h+=`<div class="card" style="border-color:#bfe3cc"><div class="card-title" style="color:var(--green-dark)">🚚 Incoming from production <span class="pill ok">${sent.length}</span></div>${sent.map(t=>`<div class="list-item"><div class="li-main"><div class="li-title">Sent ${fmtDT(t.sent_at)} by ${esc(t.sent_by||'-')}</div><div class="li-meta">${trItems(t,'qty_sent')}${t.note?' · '+esc(t.note):''}</div></div><button class="btn green sm" onclick="openReceive('${esc(t.id)}')">✓ Receive</button></div>`).join('')}</div>`;
  if(req.length)h+=`<div class="card"><div class="card-title">📝 Requested — waiting for production</div>${req.map(t=>`<div class="list-item"><div class="li-main"><div class="li-title">${fmtDT(t.requested_at||t.created_at)} by ${esc(t.requested_by||'-')}</div><div class="li-meta">${trItems(t,'qty_req')}${t.note?' · '+esc(t.note):''}</div></div><button class="btn outline sm" onclick="cancelRequest('${esc(t.id)}')">Cancel</button></div>`).join('')}</div>`;
  if(recent.length)h+=`<div class="card"><div class="card-title">Recent transfers</div>${recent.map(t=>{const short=(t.items||[]).filter(i=>t.status==='received'&&+i.qty_recv<+i.qty_sent);return`<div class="line"><span>${t.status==='received'?'✅ Received '+fmtDT(t.received_at)+' by '+esc(t.received_by||'-'):'✖ Cancelled'}<br><span class="muted" style="font-size:.76rem">${trItems(t,t.status==='received'?'qty_recv':'qty_req')}</span>${short.length?`<br><span style="color:var(--red);font-size:.76rem;font-weight:700">Short: ${short.map(i=>fq(i.qty_sent-i.qty_recv)+' '+esc(i.unit||'')+' '+esc(i.name)).join(', ')}</span>`:''}</span></div>`;}).join('')}</div>`;
  return h;
}
function openReceive(id){
  const t=(_transfers||[]).find(x=>x.id===id);if(!t)return;const its=(t.items||[]).filter(i=>+i.qty_sent>0);
  openModal(`<h2>Receive from production <button class="x-btn" onclick="closeModal()">✕</button></h2>
  <p class="note" style="margin:-6px 0 10px">Sent ${fmtDT(t.sent_at)} by ${esc(t.sent_by||'-')}. Check each item. If anything is short or damaged, change the received quantity.</p>
  ${its.map((i,k)=>`<div class="stk-row"><div class="n">${esc(i.name)}<div class="o">Sent: ${fq(i.qty_sent)} ${esc(i.unit||'')}${i.qty_req!=null&&+i.qty_req!==+i.qty_sent?' · requested '+fq(i.qty_req):''}</div></div><input class="stk-in rcv-in" type="number" inputmode="decimal" min="0" step="any" data-k="${k}" value="${fq(i.qty_sent)}" style="width:80px"><span class="muted" style="font-size:.75rem;width:38px">${esc(i.unit||'')}</span></div>`).join('')}
  <div class="fg" style="margin-top:12px"><label class="label">Note (optional)</label><input class="input" id="rcvNote" placeholder="e.g. 1 bottle leaking"></div>
  <div class="btn-row"><button class="btn outline" onclick="closeModal()">Cancel</button><button class="btn green" id="rcvSave" onclick="saveReceive('${esc(id)}')">✓ Confirm received</button></div>`,true);
}
async function saveReceive(id){
  const t=(_transfers||[]).find(x=>x.id===id);if(!t)return;const its=(t.items||[]).filter(i=>+i.qty_sent>0);
  const recv=[...document.querySelectorAll('.rcv-in')].map(inp=>Math.max(0,parseFloat(inp.value)||0));
  const note=($('rcvNote')?.value||'').trim();const now=new Date().toISOString();
  const b=$('rcvSave');if(b){b.disabled=true;b.textContent='Saving...';}
  // check it hasn't been received on another device already
  const {data:fresh}=await sb.from('mm_cafe_transfers').select('status').eq('id',id).maybeSingle();
  if(fresh&&fresh.status!=='sent'){toast('This transfer was already '+fresh.status,'error');closeModal();renderInventory();return;}
  const moves=[];
  for(let k=0;k<its.length;k++){
    const i=its[k],q=recv[k];i.qty_recv=q;if(!q)continue;
    let item=_inv.find(x=>x.hq_item_id&&x.hq_item_id===i.hq_item_id);
    if(!item){
      const row={name:i.name,unit:i.unit||'pcs',category:HQ_TO_CAFE_CAT[i.category]||'ingredient',hq_item_id:i.hq_item_id,qty:0,par_level:0,sort_order:_inv.length};
      const {error}=await sb.from('mm_cafe_inventory').insert(row);
      if(error){if(b){b.disabled=false;b.textContent='✓ Confirm received';}return toast('Failed: '+error.message,'error');}
      const {data:ni}=await sb.from('mm_cafe_inventory').select('*').eq('hq_item_id',i.hq_item_id).maybeSingle();
      item=ni||{...row,id:null};if(item.id)_inv.push(item);
    }
    if(!item.id)continue;
    const before=+item.qty||0,after=Math.round((before+q)*1000)/1000;
    const {error:ue}=await sb.from('mm_cafe_inventory').update({qty:after}).eq('id',item.id);
    if(ue){toast('Failed: '+ue.message,'error');break;}
    item.qty=after;
    moves.push({item_id:item.id,item_name:item.name,move_type:'transfer',qty:q,before_qty:before,after_qty:after,note:'From production'+(q!==+i.qty_sent?` (sent ${fq(i.qty_sent)})`+(note?' · '+note:''):''),staff_name:user.name,created_at:now});
  }
  its.forEach((i,k)=>{if(i.qty_recv==null)i.qty_recv=recv[k];});
  if(moves.length){const {error}=await sb.from('mm_cafe_inv_moves').insert(moves);if(error)console.warn(error);}
  const items=(t.items||[]).map(i=>{const m=its.find(x=>x===i);return m?{...i,qty_recv:m.qty_recv}:{...i,qty_recv:0};});
  const {error}=await sb.from('mm_cafe_transfers').update({status:'received',items,received_by:user.name,received_at:now,recv_note:note}).eq('id',id);
  if(error)return toast('Failed: '+error.message,'error');
  const short=items.filter(i=>+i.qty_recv<+i.qty_sent).length;
  toast(short?`Received ✓ — ${short} item(s) short, production will see this`:'Received ✓ Cafe stock updated','success');
  closeModal();renderInventory();
}
async function cancelRequest(id){
  if(!confirm('Cancel this request?'))return;
  const {error}=await sb.from('mm_cafe_transfers').update({status:'cancelled',cancelled_by:user.name}).eq('id',id).eq('status','requested');
  if(error)return toast('Failed: '+error.message,'error');
  toast('Request cancelled','success');renderInventory();
}
async function openRequest(lowOnly){
  $('invBody').innerHTML='<div class="card muted">Loading production items...</div>';
  const {data,error}=await sb.from('mm_inventory_items').select('id,name,unit,category,current_stock,active').eq('active',true).order('name');
  if(error){$('invBody').innerHTML=`<div class="card" style="color:var(--red)">⚠️ ${esc(error.message)}</div>`;return;}
  _hqItems=data||[];_reqForm={};_reqSearch='';_reqCat='cafe';
  if(lowOnly)_inv.filter(i=>invLow(i)&&i.hq_item_id).forEach(i=>{_reqForm[i.hq_item_id]=Math.max(1,Math.ceil(+i.par_level*2-(+i.qty||0)));});
  const linked=new Set(_inv.filter(i=>i.hq_item_id).map(i=>i.hq_item_id));
  if(!linked.size)_reqCat='all';
  $('invBody').innerHTML=`<div class="card"><div class="card-title">📝 Request from Production<button class="btn sm outline" onclick="drawInventory()">Cancel</button></div>
  <p class="note" style="margin:-4px 0 10px">Enter how much the cafe needs. Quantities are in production's units.${lowOnly?' Suggested amounts for low items are filled in — change as needed.':''}</p>
  <input class="search" style="width:100%;margin-bottom:10px" placeholder="Search production items..." oninput="_reqSearch=this.value;drawReqList()">
  <div class="chips" id="reqChips"></div>
  <div id="reqList"></div>
  <div class="fg" style="margin-top:12px"><label class="label">Note for production (optional)</label><input class="input" id="reqNote" placeholder="e.g. need before Saturday"></div>
  <div class="line"><span>Items requested</span><b id="reqCount">0</b></div>
  <div class="btn-row"><button class="btn outline" onclick="drawInventory()">Cancel</button><button class="btn green" id="reqSave" onclick="saveRequest()">📝 Send request</button></div></div>`;
  drawReqList();
}
function drawReqList(){
  const el=$('reqList');if(!el)return;
  const linked=new Map(_inv.filter(i=>i.hq_item_id).map(i=>[i.hq_item_id,i]));
  const cats=[['cafe','⭐ Cafe items'],['all','All'],...Object.entries(HQ_CAT_LABELS).filter(([k])=>_hqItems.some(i=>i.category===k))];
  $('reqChips').innerHTML=cats.map(([k,l])=>`<button class="chip-f ${_reqCat===k?'active':''}" onclick="_reqCat='${k}';drawReqList()">${l}</button>`).join('');
  const q=_reqSearch.trim().toLowerCase();
  let list=_hqItems.filter(i=>(!q||String(i.name).toLowerCase().includes(q))&&(q||_reqCat==='all'||(_reqCat==='cafe'?(linked.has(i.id)||_reqForm[i.id]):i.category===_reqCat)));
  list.sort((a,b)=>((_reqForm[b.id]?1:0)-(_reqForm[a.id]?1:0))||((linked.has(b.id)?1:0)-(linked.has(a.id)?1:0)));
  el.innerHTML=!list.length?`<div class="empty">${_reqCat==='cafe'&&!q?'No cafe items yet — pick from “All” or search.':'No items found.'}</div>`:`<div class="stk-grid">${list.slice(0,80).map(i=>{const c=linked.get(i.id);return`<div class="stk-row"><div class="n">${esc(i.name)}<div class="o">${c?'Cafe has '+fq(c.qty)+' · ':''}HQ has ${fq(i.current_stock)} ${esc(i.unit||'')}</div></div><input class="stk-in" type="number" inputmode="decimal" min="0" step="any" value="${_reqForm[i.id]||''}" placeholder="0" oninput="setReq('${esc(i.id)}',this.value)" style="width:80px"><span class="muted" style="font-size:.75rem;width:38px">${esc(i.unit||'')}</span></div>`;}).join('')}</div>${list.length>80?'<p class="note">Showing 80 — search to find more.</p>':''}`;
  updReqCount();
}
function setReq(id,v){const n=parseFloat(v);if(n>0)_reqForm[id]=n;else delete _reqForm[id];updReqCount();}
function updReqCount(){const e=$('reqCount');if(e)e.textContent=Object.keys(_reqForm).length;}
async function saveRequest(){
  const items=Object.entries(_reqForm).map(([id,q])=>{const i=_hqItems.find(x=>x.id===id);return i?{hq_item_id:i.id,name:i.name,unit:i.unit,category:i.category,qty_req:q}:null;}).filter(Boolean);
  if(!items.length)return toast('Enter at least one quantity','error');
  const b=$('reqSave');if(b){b.disabled=true;b.textContent='Sending...';}
  const now=new Date().toISOString();
  const {error}=await sb.from('mm_cafe_transfers').insert({status:'requested',items,note:($('reqNote')?.value||'').trim(),requested_by:user.name,requested_at:now});
  if(error){if(b){b.disabled=false;b.textContent='📝 Send request';}return toast('Failed: '+error.message,'error');}
  toast('Request sent to production ✓','success');renderInventory();
}


// ===================== CASH DRAWER =====================
// The drawer is wired to the printer's DK port; the printer pulses it on ESC p.
function drawerOn(){return !!printer.drawer&&printer.mode!=='none';}
function drawerBytes(){return new Uint8Array([0x1B,0x40,0x1B,0x70,printer.pin?1:0,0x19,0xFA]);}
function concatBytes(a,b){const o=new Uint8Array(a.length+b.length);o.set(a,0);o.set(b,a.length);return o;}
async function openDrawer(){if(printer.mode==='none')return toast('Set up the printer first','error');await printBytes(drawerBytes());}
async function manualOpenDrawer(){
  const reason=prompt('Why open the drawer without a sale? (e.g. change for a customer, add float)');
  if(reason===null)return;if(!reason.trim())return toast('Reason is required','error');
  await openDrawer();
  const now=new Date();
  const {error}=await sb.from('mm_pos_drawer_log').insert({log_date:dateStr(now),opened_at:now.toISOString(),staff_name:user.name,reason:reason.trim()});
  if(error)console.warn('drawer log',error);
  toast('Drawer opened · logged','success');
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user){requestWake();flushQueue();Promise.all([loadMenu(),loadStock()]).then(()=>{if(curView==='sell')drawGrid();});}});

buildKeypad();
(function boot(){
